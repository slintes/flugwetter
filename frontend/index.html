<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugwetter - Aviation Weather Forecast</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
    <!-- Pinned: unversioned jsDelivr URLs follow the latest release, so the charts
         could change behaviour without a commit here. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h2><img src="static/favicon.svg" alt="" class="header-logo">Flugwetter</h2>
            <div class="airport-picker">
                <select id="airportSelect" aria-label="Select airport"></select>
                <button type="button" id="mapPickerButton" title="Pick an airport on the map">Map…</button>
            </div>
        </header>

        <main>
            <div class="chart-instructions">
                <span class="desktop-hint">Ctrl + scroll to zoom, drag to pan</span><span class="mobile-hint">Swipe to pan, pinch to zoom</span>
                <button onclick="resetZoom(6)">6h</button>
                <button onclick="resetZoom(12)">12h</button>
                <button onclick="resetZoom(24)">24h</button>
                <button onclick="resetZoom(48)">48h</button>
                <button onclick="resetZoom(72)">72h</button>
                <button onclick="resetZoom(undefined)">All</button>
            </div>

            <!-- Above the charts on purpose: below them it sat off-screen, so a failed load
                 looked like nothing had happened. -->
            <div class="error" id="error" style="display: none;">
                <p>Failed to load weather data. Please try again later.</p>
                <button onclick="loadWeatherData()">Retry</button>
            </div>

            <!-- Shown when the backend served an expired cache entry because Open-Meteo was
                 unreachable. Old forecast data is still useful, but it must never be
                 presented as current. -->
            <div class="stale" id="stale" role="status" style="display: none;"></div>

            <div class="charts-area">
            <div class="charts-grid">
                <div class="chart-container vfr-container">
                    <h2>VFR probability</h2>
                    <canvas id="vfrChart"></canvas>
                </div>
                
                <div class="chart-container">
                    <h2>Temperature, Dew Point & Precipitation</h2>
                    <canvas id="temperatureChart"></canvas>
                </div>

                <div class="chart-container">
                    <h2>Clouds & Visibility</h2>
                    <canvas id="cloudChart"></canvas>
                </div>

                <div class="chart-container">
                    <h2>Wind</h2>
                    <canvas id="windChart"></canvas>
                </div>
            </div>

                <div class="charts-loading" id="chartsLoading" hidden>
                    <div class="spinner" role="status" aria-label="Loading weather data"></div>
                </div>
            </div>

        </main>
    </div>

    <div class="map-modal" id="airportMapModal" hidden>
        <div class="map-modal-content" role="dialog" aria-modal="true" aria-labelledby="mapModalTitle">
            <div class="map-modal-header">
                <h3 id="mapModalTitle">Select an airport</h3>
                <button type="button" id="mapModalClose" aria-label="Close map">&times;</button>
            </div>
            <div id="airportMap"></div>
            <p class="map-modal-hint">
                Click a marker to load its forecast.
                <span id="mapOverlayNote"></span>
            </p>
        </div>
    </div>

    <script src="static/weather-icons.js"></script>
    <script src="static/app.js"></script>
</body>
</html>
